name: CAC-TAT regression with Lunatic test framework
on:
  push:
    branches: [ main ]
  schedule:
    # This runs every sunday at 00:00 (Midnight) UTC
    - cron: '0 0 * * 0'
jobs:
  lunatic-web-test:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - name: Getting Lua
      uses: leafo/gh-actions-lua@v13
      with:
        luaVersion: "5.2.0"
    - name: Getting Luarocks
      uses: leafo/gh-actions-luarocks@v6
    - name: Run Lua test
      run: lua -v
    - name: Installing Lunatic Test Framework
      run: |
        luarocks install lunatic
    - name: Run a regression
      env:
        # env vars to use at step
        LUNATIC: "yes"
      run: |
        echo "Starting virtual display"
        Xvfb :99 -screen 0 1280x1024x24 &
        export DISPLAY=:99

        echo "Running the regression tests"
        cd regression
        lua web_regression.lua

        echo "Stopping virtual display"
        pkill -f Xvfb

        echo "Checking the results"
        REGRESSION_RESULT=$(cat output.txt | grep 'Failures:' | wc -l)

        if [[ "$REGRESSION_RESULT" -eq "1" ]]; then
          echo "Regression has failing tests. Check output.txt"
          exit 1
        fi
